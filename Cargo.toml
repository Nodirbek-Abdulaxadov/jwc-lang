[package]
name = "jwc"
version = "0.4.8"
edition = "2021"
# Workspace-private until a license decision lands (see deny.toml [licenses]
# `private = { ignore = true }`). Set to false explicitly so cargo-deny v2
# correctly classifies this crate as private and skips the unlicensed check.
publish = false

# Phase 2 unwrap budget tracking. The audit (Sprint 1-5 close-out)
# found ONE production `.unwrap()` after this commit — the remaining
# 119 are all inside `#[cfg(test)]` modules, which we explicitly want
# to allow. The right flip is therefore not a global `warn` (would
# spam test code) but `cfg_attr(not(test), warn(...))` per-module.
# TODO[unwrap-budget]: 1 prod unwrap remaining; flip to per-module
# `#![cfg_attr(not(test), warn(clippy::unwrap_used))]` once we have
# the test-vs-prod boundary clean.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"

[lib]
name = "jwc"
path = "src/lib.rs"

[[bin]]
name = "jwc"
path = "src/main.rs"

[[bin]]
name = "jwc-lsp"
path = "src/bin/jwc_lsp.rs"

[dependencies]
jwc-runtime = { path = "crates/jwc-runtime" }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-recursion = "1"
axum = { version = "0.7", features = ["ws", "tokio", "http2"] }
base64 = "0.22"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
deadpool-postgres = "0.14"
hmac = "0.12"
lazy_static = "1.5.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
native-tls = "0.2"
notify = "6"
postgres-native-tls = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tower-lsp = "0.20"
url = "2"

# Optional OTLP tracing exporter (Sprint 5B). Gated behind the `otlp`
# Cargo feature so the default build doesn't pull these in. The runtime
# trigger is the `JWC_OTLP_ENDPOINT` env var — feature `otlp` only
# controls whether the code is compiled.
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
testcontainers = { version = "0.20", features = ["blocking"] }
testcontainers-modules = { version = "0.8", features = ["postgres", "blocking"] }
tempfile = "3"
