[package]
name = "jwc"
version = "0.9.903"
edition = "2021"
# Workspace-private until a license decision lands (see deny.toml [licenses]
# `private = { ignore = true }`). Set to false explicitly so cargo-deny v2
# correctly classifies this crate as private and skips the unlicensed check.
publish = false

# Unwrap budget: CLOSED. `src/lib.rs` carries
# `#![cfg_attr(not(test), deny(clippy::unwrap_used))]`, so production code is
# unwrap-free and enforced; `#[cfg(test)]` modules keep unwrapping freely.
# The `allow` below is what that attribute overrides — it exists so unit and
# integration tests aren't required to handle every Result.
#
# `expect_used` stays allowed on purpose, not as debt. `cargo clippy --lib`
# reports 57 in production and they are not the same thing as an unwrap:
#
#   - 14 `Regex::new("<literal>")` in schema_diff — a literal that fails to
#     compile would fail on every run, not on unlucky input.
#   - 9 header values built from ASCII literals in server.rs.
#   - ~10 local invariants restated at the use site ("head key just
#     inserted", "ManyToMany navigation must carry join-table coordinates").
#   - the rest are lock poisoning, where the message IS the diagnosis.
#
# Rewriting those to `unwrap_or_else(|| unreachable!())` moves the panic
# without removing it and costs the explanation. Denying the lint would
# force exactly that, so it stays allowed and the expects stay honest.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
# The AST `Expr`/`WhereExpr` enums have inherently large variants (DbSelect
# carries the full query shape). Boxing every variant would hurt readability of
# the tree without a measured win; allow the size-difference lint here.
large_enum_variant = "allow"

[lib]
name = "jwc"
path = "src/lib.rs"

[[bin]]
name = "jwc"
path = "src/main.rs"

[dependencies]
jwc-runtime = { path = "crates/jwc-runtime" }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-recursion = "1"
axum = { version = "0.7", features = ["ws", "tokio", "http2"] }
base64 = "0.22"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
deadpool-postgres = "0.14"
hmac = "0.12"
# RS256 (OIDC) signature verification. Already compiled as part of the
# tree via rustls, so naming it directly costs no extra build — but it
# must be a direct dependency for `ring::signature` to be nameable.
ring = "0.17"
lazy_static = "1.5.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
native-tls = "0.2"
notify = "6"
postgres-native-tls = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tower-lsp = "0.20"
url = "2"

# The listener. `axum::serve` is a convenience wrapper over exactly these
# and it hides the two knobs config.md §3 promises: `hyper-util`'s auto
# builder is where `header_read_timeout` lives, and TLS means owning the
# accept loop so a `TcpStream` can be wrapped before hyper sees it. All
# four already compile as part of the tree (axum, reqwest), so naming them
# directly costs no extra build — it only makes them nameable.
#
# rustls uses the `ring` provider, which is already a direct dependency;
# `aws-lc-rs` would drag cmake and a C toolchain into every build.
# PEM parsing comes from `rustls-pki-types` rather than `rustls-pemfile`,
# which carries an open advisory and is dev-only here — a fact
# `tests/hardening.rs` asserts against the real dependency tree.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }

# Optional OTLP tracing exporter (Sprint 5B). Gated behind the `otlp`
# Cargo feature so the default build doesn't pull these in. The runtime
# trigger is the `JWC_OTLP_ENDPOINT` env var — feature `otlp` only
# controls whether the code is compiled.
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
rust_decimal = { version = "1.42.1", default-features = false, features = ["db-postgres"] }
bytes = "1"

# Optional Redis driver (ecosystem.md Faza 1, core tier). Gated behind the
# `redis` Cargo feature so the default build doesn't pull these in. The
# runtime trigger is the `JWC_REDIS_URL` env var — feature `redis` only
# controls whether the driver is compiled. The `redis_*` built-ins are
# always present in `BUILTIN_DEFS` (so `jwc check` / typecheck arity and
# the generated builtins doc don't shift with build flags); without the
# feature their bodies raise `RedisError` at call time.
#
# `default-features = false` drops the crate's sync client and its
# `aio`-adjacent extras we don't use; `tokio-comp` plugs the async
# connection into our tokio runtime, `script` powers `redis_eval`.
#
# `tokio-rustls-comp` + `tls-rustls-webpki-roots` make `rediss://` URLs
# work, which every managed Redis (Upstash, ElastiCache in-transit,
# Redis Cloud) requires. rustls — not native-tls — because the rest of
# the tree already links rustls via reqwest/lettre; webpki roots because
# the runtime ships in scratch/distroless containers with no system
# trust store to read.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "script", "keep-alive"], optional = true }
deadpool-redis = { version = "0.18", default-features = false, features = ["rt_tokio_1"], optional = true }

[features]
default = []
redis = ["dep:redis", "dep:deadpool-redis"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
testcontainers = { version = "0.20", features = ["blocking"] }
testcontainers-modules = { version = "0.8", features = ["postgres", "redis", "blocking"] }
tempfile = "3"

# musl release builds pull openssl-sys transitively (native-tls /
# postgres-native-tls drive DB TLS in engine.rs). musl has no system openssl,
# so the release pipeline's `x86_64-unknown-linux-musl` build failed at
# `openssl-sys` since v0.4.8. Vendor openssl from source for the musl target
# only — gnu / windows / dev builds are unaffected.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
