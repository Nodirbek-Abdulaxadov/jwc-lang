[package]
name = "jwc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
lazy_static = "1.5.0"
notify = "6"
postgres = "0.19.12"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"
