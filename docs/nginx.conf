server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness / readiness probe target.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Long-cache the immutable build assets that Docusaurus emits under /assets.
  location ~* ^/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-style fallback: serve index.html for anything that doesn't map to a file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Standard security + UX headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;

  # Disable directory listings.
  autoindex off;

  # Compression for text-ish assets.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml application/wasm;
}
