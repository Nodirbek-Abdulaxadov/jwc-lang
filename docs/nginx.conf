# Cache policy, keyed off the request path. This lives in a `map` rather than
# per-location `add_header` because nginx's add_header inheritance is
# all-or-nothing: a single add_header inside a location discards *every*
# header set at the server level. Driving Cache-Control from one variable
# keeps the security headers below on every response, including assets.
map $uri $jwc_cache_control {
  # HTML is cheap and changes every deploy — revalidate, never serve stale.
  default    "public, max-age=0, must-revalidate";
  # Docusaurus content-hashes everything under /assets, so it is immutable.
  ~^/assets/ "public, max-age=31536000, immutable";
  # Logos and the social card keep their filenames across deploys.
  ~^/img/    "public, max-age=86400";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS terminates at Cloudflare, so nginx only ever sees plain HTTP. An
  # absolute redirect therefore names `http://` — which is how every
  # canonical URL on this site used to answer
  #
  #   GET https://jwc.1kb.uz/language/syntax
  #     -> 301 http://jwc.1kb.uz/language/syntax/
  #
  # a protocol downgrade and a scheme change on the way to the page a
  # crawler was told is canonical. Relative redirects keep the client's
  # scheme and host.
  absolute_redirect off;
  port_in_redirect off;

  # Liveness / readiness probe target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # These two are the crawler's entry points and must never fall through to
  # the HTML handler. They used to: the old catch-all answered /robots.txt
  # with 27 KB of homepage HTML under a 200.
  location = /robots.txt  { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }

  # Site is served without trailing slashes (`trailingSlash: false`), which
  # is what every canonical tag and every sitemap entry says. Collapse the
  # slashed form onto it in one hop instead of leaving two live URLs.
  # `/` itself can't match — `.+` needs a character ahead of the slash.
  location ~ ^(?<jwc_path>.+)/$ {
    return 301 $jwc_path$is_args$args;
  }

  # `try_files $uri/` would answer /language/syntax with a 301 to
  # /language/syntax/, so every URL in the sitemap redirected. Naming
  # index.html directly serves the page at the canonical URL under a 200.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # The root is the one path where `$uri` is itself a directory; without
  # this it re-enters `location /` and loops.
  location = / {
    try_files /index.html =404;
  }

  # A URL that maps to nothing gets Docusaurus' 404 page under a real 404.
  # The old SPA-style fallback returned the homepage with a 200 for every
  # unmatched path, so an unbounded set of URLs each answered as a
  # duplicate of the front page — soft 404s, and `404.html` was dead weight
  # in the image.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Standard security + UX headers. Because of the inheritance rule noted
  # at the top of this file, no `location` above may add a header of its
  # own — anything path-specific belongs in the map.
  add_header Cache-Control $jwc_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;

  # Disable directory listings.
  autoindex off;

  # Compression for text-ish assets.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml application/wasm;
}
