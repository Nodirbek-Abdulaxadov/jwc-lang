name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--features redis` is a second compilation of `redis_engine`, none
      # of it reachable from the default build — so a clippy failure or a
      # `#[cfg]`-only type error in that code shipped green.
      - name: Cargo clippy (redis feature)
        run: cargo clippy --workspace --all-targets --features redis -- -D warnings

      - name: Cargo build
        run: cargo build --workspace --all-targets

      # Everything that does not need a database. Named rather than a bare
      # `cargo test`, so that a suite is run under the environment it
      # needs rather than skipping in whichever job happened to pick it up.
      #
      # The naming was supposed to make an omission visible. It did not:
      # seven suites, `hardening` among them, were listed in no job at all
      # and nothing said so. `every_test_suite_is_named_in_ci` in
      # `tests/hardening.rs` now compares this file against `tests/` and
      # fails on a suite that appears in neither.
      - name: Cargo test (no DB)
        run: >
          cargo test --lib
          --test parse_corpus --test fmt --test removed_keywords
          --test schema_diagnostics --test type_corpus --test wiring_corpus
          --test ddl_golden --test sql_golden --test docs_parse
          --test diff_corpus --test hardening --test lsp --test packages
          --test registry --test snapshot_sample --test static_assets
          --test templates --test tooling --test socket_limits

      - name: Cargo test (redis feature, no server)
        run: cargo test --features redis --lib

      # The sample is the artefact the spec is read against, so its
      # formatting is required rather than advisory.
      - name: jwc fmt --check the sample
        run: cargo run --bin jwc -- fmt --check docs/spec/v1/sample

  # The query layer gets its own job with a real database. `check` above runs
  # only the no-DB suites, which is why a `where` clause that dropped half its
  # predicates shipped in every release up to 0.8.0: the SQL *string* it built
  # looked correct, and nothing ever executed it.
  #
  # A service container rather than testcontainers — the runner exposes it on
  # localhost, so the suite takes it straight from JWC_TEST_DATABASE_URL and
  # there is no Docker-in-Docker to fail.
  # Everything else here runs on ubuntu, so `#[cfg(windows)]` code is
  # compiled out and never type-checked. The only thing that built it was
  # the release workflow, which runs on tags — so `check_path_length` went
  # out in v0.9.913 referencing two constants that were never declared, and
  # the first sign of it was a failed release.
  #
  # `cargo check`, not build or test: this exists to compile the cfg'd-out
  # branches, and a full Windows build costs minutes for nothing extra.
  windows:
    name: cfg(windows) compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (redis feature)
        run: cargo check --workspace --all-targets --features redis

  # Same reason as the windows job: a target that only the release
  # workflow builds is a target whose first failure is a failed release.
  # v0.9.913 shipped without a Windows binary that way.
  macos:
    name: macOS compiles
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (redis feature)
        run: cargo check --workspace --all-targets --features redis

      # The release builds the Intel target by cross-compiling from this
      # same arm64 runner, so the cross has to be checked here too — a
      # linker that cannot produce x86_64 would otherwise be found by a tag.
      - name: Cargo check (x86_64 cross)
        run: cargo check --workspace --features redis --target x86_64-apple-darwin

  # The generated crate, actually compiled.
  #
  # `--test native` string-matches the Rust codegen emits and deliberately
  # never invokes cargo on it, so the `.rs.in` preludes — ~6,000 lines that
  # are pasted into that crate and compiled nowhere else — were type-checked
  # by no job in this workflow. `cargo build` at the top of this file builds
  # the *compiler*; a prelude that does not compile is invisible to it.
  #
  # Two of them shipped that way. 0.9.929's `jwc_set_field_path` turned a
  # record into a hash map, which sorts on serialisation, so a native binary
  # answered a different JSON key order than `jwc serve` — and the release
  # was green. The first attempt at the fix did not compile at all, and
  # every job here still passed.
  #
  # This builds one program per template so the four starter trees are
  # covered, then runs the smallest of them and checks it answers.
  native-build:
    name: the generated crate compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the compiler
        run: cargo build --release

      # `empty` and `api` between them reach the base, v1, db, crypto and
      # asset preludes. `auth` adds the JWT and password paths; `jobs` adds
      # the queue driver.
      - name: Compile a native binary from every template
        run: |
          set -euo pipefail
          for t in empty api auth jobs; do
            echo "::group::$t"
            rm -rf "/tmp/nb-$t"
            ./target/release/jwc new "nb-$t" --template "$t" --path "/tmp/nb-$t"
            ./target/release/jwc build "/tmp/nb-$t" --release
            test -x "/tmp/nb-$t/bin/release/nb-$t"
            echo "::endgroup::"
          done

      # Compiling is not running. A binary that links and then dies on the
      # first request is the failure this is really about.
      - name: Run the binary and check it answers
        run: |
          set -euo pipefail
          /tmp/nb-empty/bin/release/nb-empty &
          pid=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          kill $pid

  postgres:
    name: against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jwc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The sample rate-limits every route through `redis.rate_limit`,
      # with no `redis.enabled()` guard — correctly, because a limiter
      # that admits the request when its store is missing is not one. So
      # exercising the sample needs a Redis exactly the way it needs a
      # Postgres. It did not while `redis.rate_limit` was a stub that
      # answered `true`, and every case here passed against a limiter that
      # had never limited anything.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The SQL goldens freeze the text; these run it. Every compiled
      # statement is PREPAREd, the join shapes are checked against real
      # rows, and the two-stage page rewrite is checked against an EXPLAIN
      # plan on 100k rows — none of which a golden file can see.
      #
      # The suites print SKIPPED without these variables and pass. That is
      # exactly why they are set here: a SKIPPED line is not a pass.
      - name: SQL goldens against Postgres
        env:
          JWC_V1_PG: "-h 127.0.0.1 -p 5432 -U postgres"
          PGPASSWORD: postgres
        run: cargo test --test sql_golden -- --nocapture

      # `--features redis` because the sample's rate limiter is real now:
      # without the driver compiled in, `redis.rate_limit` raises and every
      # route answers 500.
      - name: HTTP goldens, the raw valve, and reserved physical names
        env:
          JWC_V1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
          JWC_TEST_REDIS_URL: redis://127.0.0.1:6379
          CURSOR_SECRET: ci-cursor-secret
        run: >
          cargo test --features redis
          --test http_golden --test raw_hatch --test reserved_names --test native -- --nocapture

      - name: DDL applies
        env:
          JWC_V1_PG: "-h 127.0.0.1 -p 5432 -U postgres"
          PGPASSWORD: postgres
        run: cargo test --test ddl_golden -- --nocapture

      # The four suites this job used to leave out, which is the same
      # mistake one level up: they are gated on a database, they print
      # SKIPPED without one, and a SKIPPED line is not a pass. Between
      # them they are the only cover for the applier, the test framework,
      # the migration round-trip property, and the apply half of the
      # migration goldens — every claim in v0.26 and v0.28 that a golden
      # file cannot see.
      - name: Migrations, the applier, `jwc test`, and the job queue
        env:
          JWC_V1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
          JWC_V1_PG: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
          PGPASSWORD: postgres
          CURSOR_SECRET: ci-cursor-secret
        run: >
          cargo test
          --test migrate_apply --test migrate_golden
          --test migrate_roundtrip --test jwc_test --test jobs_queue
          -- --nocapture

      # The listener, which needs no database but does need a socket and
      # openssl on PATH. `tls { }` and `header_timeout` are unobservable
      # below the point where a request exists, so nothing else covers
      # them.
      - name: The listener
        run: cargo test --test serve_listener -- --nocapture

      # `hardening` runs in the no-DB job too, where its timing test
      # skips. The timing claim — that the two failure branches of `login`
      # cost the same — is a measurement against real Argon2id work on a
      # real stored hash, so it only means anything here.
      - name: The login timing branch
        env:
          JWC_V1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
          JWC_TEST_REDIS_URL: redis://127.0.0.1:6379
          PGPASSWORD: postgres
        run: cargo test --features redis --test hardening -- --nocapture

  # Same reasoning as `postgres` above: the no-server jobs only
  # prove the code compiles and the stubs behave. Every command this driver
  # sends — TTL semantics, nil-vs-empty-string, EVAL's KEYS/ARGV framing —
  # is a claim about what a real server does, and nothing verified any of
  # it. A service container rather than testcontainers, so there is no
  # Docker-in-Docker to fail.
  redis-integration:
    name: redis driver vs a real server
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Takes the service container through `JWC_TEST_REDIS_URL`. Without
      # it the suite skips every test and still reports ok — a skip is not
      # a pass, so this variable is what makes the job mean anything.
      - name: Redis integration suite
        env:
          JWC_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test integration_redis -- --nocapture
