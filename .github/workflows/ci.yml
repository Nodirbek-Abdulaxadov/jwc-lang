name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo build
        run: cargo build --workspace --all-targets

      - name: Cargo test (no DB)
        run: cargo test --lib --test typed_catch --test imports --test native_emit --test examples_parse --test fmt_idempotency

      # First-release rollout: `jwc fmt --check` against the bundled fixture
      # roots. `continue-on-error` keeps drift from blocking unrelated PRs
      # while we settle the canonical output; flip to required once the
      # corpus is fully reformatted.
      - name: jwc fmt --check examples templates
        continue-on-error: true
        run: cargo run --bin jwc -- fmt --check examples templates

  # The query layer gets its own job with a real database. `check` above runs
  # only the no-DB suites, which is why a `where` clause that dropped half its
  # predicates shipped in every release up to 0.8.0: the SQL *string* it built
  # looked correct, and nothing ever executed it.
  #
  # A service container rather than testcontainers — the runner exposes it on
  # localhost, so the suite takes it straight from JWC_TEST_DATABASE_URL and
  # there is no Docker-in-Docker to fail.
  query-differential:
    name: query layer vs hand-written SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jwc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Query differential suite
        env:
          JWC_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
        run: cargo test --test query_differential -- --nocapture

      - name: Postgres integration suite
        env:
          JWC_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jwc_test
        # Still testcontainers-based, so it skips here rather than failing.
        # Tracked for 1.0: it should take the service container like the suite
        # above, and a skip should not read as a pass.
        continue-on-error: true
        run: cargo test --test integration_db -- --nocapture
