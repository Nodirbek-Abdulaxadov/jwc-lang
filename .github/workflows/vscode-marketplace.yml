name: Publish VS Code extension

# Builds + publishes the JWC VS Code extension to the official Marketplace
# (VSCE) and OpenVSX (Eclipse Foundation alternative used by VSCodium /
# Gitpod / Theia). Triggered on tag push (`v*`) AND manual dispatch.
#
# Secrets required:
#   - VSCE_PAT  — Visual Studio Marketplace Personal Access Token
#                  (https://dev.azure.com/<org>/_usersSettings/tokens with
#                  scope `Marketplace -> Manage`). Missing → publish skipped.
#   - OVSX_PAT  — OpenVSX namespace token from open-vsx.org. Missing →
#                  OpenVSX publish skipped (best-effort secondary).
#
# Both publishes are guarded so a missing secret degrades to "package the
# .vsix and upload as a GitHub Release artefact" rather than failing the run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write    # upload the .vsix to the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install deps + compile
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      # `vsce publish` happily creates a NEW extension when the identifier
      # changes, prints "Published ...", and exits 0. That is how every
      # release from 0.5.2 to 0.8.2 went to `Nodirbek-Abdulaxadov.jwc-language`
      # while users kept installing `jwc-extension.jwc-lang` — the marketplace
      # sat at 0.4.7 for two months with a green pipeline the whole time.
      #
      # The identifier is what users' editors key their installs off, so it is
      # a published contract, not a config value. Pin it here: renaming the
      # publisher or the extension now has to be a deliberate edit to this
      # line, not a silent fork.
      - name: Verify the extension identifier
        run: |
          expected="jwc-extension.jwc-lang"
          actual="$(jq -r '.publisher + "." + .name' package.json)"
          if [ "$actual" != "$expected" ]; then
            echo "::error ::Extension identifier is '$actual' but this pipeline publishes '$expected'."
            echo "::error ::Publishing under a different identifier creates a separate extension that existing users will never receive."
            echo "::error ::If the change is intended, update 'expected' in .github/workflows/vscode-marketplace.yml."
            exit 1
          fi
          echo "Publishing as $actual"

      # The icon shipped for two months as a 68-byte 1x1 placeholder, which is
      # why the marketplace listing showed a blank square. Nothing rejected it
      # — vsce packages whatever the manifest points at — so it needs a check
      # of its own. 128x128 is the marketplace minimum.
      - name: Verify the icon
        run: |
          icon="$(jq -r '.icon // empty' package.json)"
          if [ -z "$icon" ]; then
            echo "::error ::package.json declares no icon."
            exit 1
          fi
          if [ ! -f "$icon" ]; then
            echo "::error ::Icon '$icon' is missing."
            exit 1
          fi
          # One line on purpose. A `run: |` block scalar ends at the first
          # line indented less than the block, and Python rejects a leading
          # indent on a top-level statement — so a multi-line `python3 -c`
          # here cannot satisfy both. The filename goes through argv rather
          # than being interpolated into the source, and the single quotes
          # keep bash out of the escape sequences.
          dims="$(python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); sys.exit("not a PNG") if d[:8]!=b"\x89PNG\r\n\x1a\n" else None; print("%d %d" % struct.unpack(">II", d[16:24]))' "$icon")"
          w="${dims% *}"; h="${dims#* }"
          echo "Icon $icon is ${w}x${h}"
          if [ "$w" -lt 128 ] || [ "$h" -lt 128 ]; then
            echo "::error ::Icon is ${w}x${h}; the marketplace requires at least 128x128."
            exit 1
          fi

      - name: Resolve version (tag → package.json semver)
        id: ver
        run: |
          # If invoked via tag push, strip the leading `v` to get a clean SemVer.
          # Manual dispatch falls back to whatever package.json carries.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tagged release v${VERSION}; bumping package.json"
            npx --yes @vscode/vsce@latest --version >/dev/null
            jq --arg v "$VERSION" '.version = $v' package.json > package.json.new
            mv package.json.new package.json
          else
            VERSION=$(jq -r .version package.json)
            echo "Manual run; using existing version v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package .vsix
        run: |
          npx --yes @vscode/vsce@latest package --no-yarn \
            --out "jwc-lang-${{ steps.ver.outputs.version }}.vsix"

      - name: Attach .vsix to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/jwc-lang-${{ steps.ver.outputs.version }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@latest publish --no-yarn --pat "$VSCE_PAT"

      - name: Publish to OpenVSX (best effort)
        if: env.OVSX_PAT != ''
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx --yes ovsx@latest publish --pat "$OVSX_PAT" \
            "jwc-lang-${{ steps.ver.outputs.version }}.vsix"

      - name: Skip publish (no secrets)
        if: env.VSCE_PAT == '' && env.OVSX_PAT == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "::notice ::Neither VSCE_PAT nor OVSX_PAT is set — .vsix was packaged + uploaded to the GitHub Release, but no marketplace publish ran. Configure repo secrets to enable publishing."
