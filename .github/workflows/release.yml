name: Release jwc binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version label (default: tag name / dev-<sha>)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            short: x86_64-linux
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            short: x86_64-unknown-linux-musl
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            short: x86_64-windows
            ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compute version label
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "label=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --bin jwc --bin jwc-lsp --target ${{ matrix.target }}

      - name: Strip (linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/jwc
          strip target/${{ matrix.target }}/release/jwc-lsp

      - name: Package (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/jwc stage/
          cp target/${{ matrix.target }}/release/jwc-lsp stage/
          cp README.md ROADMAP.md stage/
          asset="jwc-${{ steps.ver.outputs.label }}-${{ matrix.short }}.tar.gz"
          tar -czf "$asset" -C stage .
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path stage -Force
          Copy-Item "target/${{ matrix.target }}/release/jwc.exe"    "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/jwc-lsp.exe" "$stage/"
          Copy-Item README.md, ROADMAP.md "$stage/"
          $asset = "jwc-${{ steps.ver.outputs.label }}-${{ matrix.short }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          # `sha256sum -c` compatible format: "<hash>  <filename>"
          Set-Content -Path "$asset.sha256" -Value "$hash  $asset" -NoNewline -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$asset"

      - name: Upload artifact (for manual runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.short }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

# The VS Code extension is NOT published here. It has its own workflow —
# .github/workflows/vscode-marketplace.yml — which fires on the same `v*`
# tag and additionally verifies the extension identifier and the icon,
# publishes to OpenVSX, and degrades gracefully when a token is missing.
#
# This file used to carry a second `publish-vscode` job doing the same
# thing. Both raced on every tag; the marketplace workflow is standalone
# while this one waits on the build matrix, so it always lost and got
# `jwc-extension.jwc-lang v0.8.4 already exists.` — a red X on an otherwise
# complete release. The .vsix on the GitHub Release comes from the other
# workflow too, so nothing is lost by removing it.
