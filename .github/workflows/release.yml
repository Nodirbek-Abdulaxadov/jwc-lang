name: Release jwc binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version label (default: tag name / dev-<sha>)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            short: x86_64-linux
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            short: x86_64-windows
            ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compute version label
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "label=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --bin jwc --bin jwc-lsp --target ${{ matrix.target }}

      - name: Package (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/jwc stage/
          cp target/${{ matrix.target }}/release/jwc-lsp stage/
          cp README.md ROADMAP.md stage/
          asset="jwc-${{ steps.ver.outputs.label }}-${{ matrix.short }}.tar.gz"
          tar -czf "$asset" -C stage .
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path stage -Force
          Copy-Item "target/${{ matrix.target }}/release/jwc.exe"    "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/jwc-lsp.exe" "$stage/"
          Copy-Item README.md, ROADMAP.md "$stage/"
          $asset = "jwc-${{ steps.ver.outputs.label }}-${{ matrix.short }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$asset"

      - name: Upload artifact (for manual runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.short }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Optional mirror to a self-hosted S3/MinIO bucket. Skipped silently
      # when the secrets aren't configured, so forks don't fail here.
      - name: Mirror to MinIO (optional)
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/') &&
          env.MINIO_ENDPOINT != ''
        env:
          MINIO_ENDPOINT:   ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET:     ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_REGION:     ${{ secrets.MINIO_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.MINIO_REGION || 'us-east-1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MINIO_ENDPOINT:-}" || -z "${MINIO_BUCKET:-}" ]]; then
            echo "MinIO secrets not set, skipping mirror."
            exit 0
          fi
          # Use the official aws CLI (preinstalled on GH runners) against MinIO.
          aws --endpoint-url "$MINIO_ENDPOINT" s3 cp "$ASSET" "s3://$MINIO_BUCKET/$ASSET"
          # Also publish a stable "latest" pointer so install scripts can
          # resolve the most recent build without API calls.
          stable="jwc-latest-${{ matrix.short }}.${{ matrix.ext }}"
          aws --endpoint-url "$MINIO_ENDPOINT" s3 cp "$ASSET" "s3://$MINIO_BUCKET/$stable"
