name: Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (default: derived from tag; falls back to dev-<sha>)'
        required: false

permissions:
  contents: read
  packages: write
  id-token: write   # for provenance attestation

env:
  REGISTRY: ghcr.io
  # Resolved from the repo owner at run time by the "Resolve image
  # namespace" step — see the same note in docs.yml. Hardcoding
  # `nodirbek-abdulaxadov` broke every push once the repo moved to the
  # `just-web-code` org: the workflow token may only write packages under
  # its own owner, so ghcr answered `permission_denied: The requested
  # installation does not exist`.

# arm64 is built on GitHub's native ARM runners rather than under QEMU. The
# emulated leg compiled the Rust release for 30+ minutes and effectively hung,
# which is why arm64 was dropped to amd64-only; native runners are the fix
# that note called for, and they are free for public repos.
#
# Multi-runner builds cannot push tags directly — two runners pushing the same
# tag would each overwrite the other's single-arch manifest. So each arch
# pushes *by digest* only, and a merge job stitches the digests into one
# multi-arch manifest list under the real tags. This is Docker's documented
# pattern for distributing a build across runners.
jobs:
  build-push:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: jwc
            dockerfile: Dockerfile
            description: 'JWC compiler + runtime CLI'
          - name: jwc-runtime
            dockerfile: Dockerfile.slim
            description: 'Minimal distroless runtime base for JWC native apps'
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # ghcr rejects an uppercase path segment, and this repo's previous
      # owner (`Nodirbek-Abdulaxadov`) was mixed case — so lowercase it
      # rather than interpolating `github.repository_owner` directly.
      - name: Resolve image namespace
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAMESPACE=${owner,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — tags are applied once, by the merge job.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # `push-by-digest` publishes the layers and returns a digest without
      # claiming any tag. Nothing is user-visible until the merge job runs.
      #
      # If the merge step ever fails with an unexpected-media-type error, the
      # attestations below are the cause — `imagetools create` is stitching
      # index manifests rather than image manifests. The remedy is to set
      # `provenance: false` and `sbom: false` here, at the cost of dropping
      # supply-chain metadata. Keeping them on preserves what this workflow
      # already published for amd64.
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          # Scope carries the arch: a shared scope would have the two runners
          # overwriting each other's cache on every build.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      # The digest is passed to the merge job as an empty file named after it —
      # the filename is the payload, which keeps the artifact tiny.
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest ${{ matrix.image.name }}
    needs: build-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: jwc
            description: 'JWC compiler + runtime CLI'
          - name: jwc-runtime
            description: 'Minimal distroless runtime base for JWC native apps'

    steps:
      - name: Resolve image namespace
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAMESPACE=${owner,,}" >> "$GITHUB_ENV"

      # Exact artifact names, deliberately not a glob. `pattern:
      # digests-jwc-*` also matched `digests-jwc-runtime-amd64` — one image's
      # name is a prefix of the other's — so the `jwc` merge collected four
      # digests, two of which belong to a different repository, and
      # imagetools failed with
      #   ERROR: ghcr.io/just-web-code/jwc@sha256:1ee0569e…: not found
      # `jwc-runtime` merged fine because its prefix happens to be unique,
      # which is exactly how a bug like this hides. Exact names cannot
      # collide; adding an architecture means adding a step, which is
      # visible rather than silent.
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.image.name }}-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.image.name }}-arm64
          path: /tmp/digests

      # Cheap assertion with a legible message. The failure above surfaced as
      # a registry 404 about a digest, which says nothing about the real
      # cause; a count check names it immediately.
      - name: Check digest count
        working-directory: /tmp/digests
        run: |
          found=$(ls -1 | wc -l)
          if [ "$found" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64, arm64) for ${{ matrix.image.name }}, found ${found}: $(ls -1 | tr '\n' ' ')"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version label
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            label="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            label="${{ inputs.version }}"
          else
            label="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.label }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}@sha256:%s ' *)

      # Fails the job if the manifest list did not come out multi-arch, so a
      # silently amd64-only image can't ship again.
      - name: Verify both architectures are present
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}:${{ steps.ver.outputs.label }}"
          docker buildx imagetools inspect "$ref"
          # Parse the index rather than grepping it — `--raw` formatting is not
          # a stable contract, and a whitespace change would turn this into a
          # false failure. Attestation manifests carry unknown/unknown here and
          # are simply absent from the match.
          archs="$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '[.manifests[]?.platform.architecture] | unique | join(" ")')"
          echo "architectures: ${archs}"
          for arch in amd64 arm64; do
            case " ${archs} " in
              *" ${arch} "*) ;;
              *) echo "::error::${ref} is missing linux/${arch}"; exit 1 ;;
            esac
          done
