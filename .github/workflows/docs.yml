name: Build and Deploy Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Namespace is NOT hardcoded — it is resolved from the repo owner at run
  # time by the "Resolve image name" step below, which sets IMAGE_NAME.
  # It used to read `nodirbek-abdulaxadov/jwc-docs`; when the repo moved to
  # the `just-web-code` org the push failed with `permission_denied: The
  # requested installation does not exist`, because the workflow token can
  # only write packages under its own owner.
  IMAGE_REPO: jwc-docs
  GITOPS_REPO: musanna-soft/k8s-gitops
  GITOPS_FILE: apps/jwc-docs/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ghcr rejects an uppercase path segment, and this repo's previous
      # owner (`Nodirbek-Abdulaxadov`) was mixed case — so lowercase it
      # rather than interpolating `github.repository_owner` directly.
      - name: Resolve image name
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=${owner,,}/${IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout k8s-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: k8s-gitops

      - name: Update image tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.REGISTRY }}/${IMAGE_NAME}:main-${SHORT_SHA}"
          FILE="k8s-gitops/${{ env.GITOPS_FILE }}"

          echo "Updating $FILE → $IMAGE_TAG"

          # Match on the image NAME only, not the full registry/namespace
          # path. The previous pattern pinned the whole old path, so the
          # first run after an owner change matched nothing, committed
          # nothing, and exited 0 — a silent no-deploy. This rewrites the
          # line whatever namespace it currently carries, so the migration
          # heals itself on the next push.
          sed -i -E "s|image:[[:space:]]*[^[:space:]]*/${IMAGE_REPO}:[^[:space:]]*|image: ${IMAGE_TAG}|g" "$FILE"

          # A no-op sed is a deploy that silently doesn't happen. Fail loud.
          if ! grep -qF "image: ${IMAGE_TAG}" "$FILE"; then
            echo "::error ::sed did not update $FILE — no line matched '/${IMAGE_REPO}:'. Current image lines:"
            grep -n "image:" "$FILE" || true
            exit 1
          fi

      - name: Commit and push changes
        run: |
          cd k8s-gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GITOPS_FILE }}"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git commit -m "chore(jwc-docs): bump image to main-${SHORT_SHA}"

          # Guard against concurrent gitops pushes from sibling repos.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed, attempt $i — retrying..."
            sleep $((i * 2))
          done
          exit 1
